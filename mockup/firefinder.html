<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Firefinder — Mockup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #18140e;
    color: #e4d8bc;
    font-family: Georgia, 'Times New Roman', serif;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  h1 {
    font-size: 0.85em;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #c8a84a;
    font-weight: normal;
  }

  #subtitle {
    font-size: 0.72em;
    color: #5a5040;
    letter-spacing: 0.08em;
  }

  #firefinder {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }

  #photo-wrapper {
    position: relative;
    line-height: 0;
    user-select: none;
  }

  #photo {
    display: block;
    width: 900px;
    max-width: 90vw;
    height: auto;
  }

  #sight-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #azimuth-canvas {
    display: block;
  }

  #status-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
    padding-top: 10px;
  }

  #readout {
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.65em;
    color: #f0e07a;
    letter-spacing: 0.04em;
  }

  #hint {
    font-size: 0.72em;
    color: #4e4434;
    text-align: right;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>Osborne Firefinder Simulator — Mockup</h1>
<div id="subtitle">Photograph: DelilahWest &nbsp;|&nbsp; Azimuth range: 262° – 287°</div>

<div id="firefinder">
  <div id="photo-wrapper">
    <img id="photo" src="DelilahWest.png" alt="Panorama — Delilah West">
    <canvas id="sight-canvas"></canvas>
  </div>
  <canvas id="azimuth-canvas"></canvas>
  <div id="status-bar">
    <div id="readout">Az: — ° —′</div>
    <div id="hint">O &ensp; toggle sight &nbsp;|&nbsp; ← / → &ensp; move 1′ &nbsp;|&nbsp; Shift + ← / → &ensp; move 1°</div>
  </div>
</div>

<script>
'use strict';

// ── Configuration ──────────────────────────────────────────────
const LEFT_AZ  = 262;
const RIGHT_AZ = 287;
const AZ_RANGE = RIGHT_AZ - LEFT_AZ;  // 25 degrees

// Strip heights (px)
const VH = 44;   // vernier strip height
const BH = 58;   // base plate height

// Sight shape constants (distances in px, measured from sight center)
const S = {
  outerHW : 40,   // outer half-width
  innerHW : 21,   // inner aperture half-width (transparent region)
  topCap  : 22,   // solid cap height above inner window
  footOut : 13,   // outward overhang of foot beyond outer edge
  footH   : 22,   // total foot section height
  cr      : 10,   // inner window corner radius
};


// ── State ──────────────────────────────────────────────────────
let sightFrac    = 0.5;    // 0.0 = left photo edge, 1.0 = right photo edge
let sightVisible = false;  // sight/vernier/baseplate hidden until first toggle
let sightShownOnce = false; // tracks whether sight has been positioned yet
let PW = 900, PH = 500;

// ── Elements ───────────────────────────────────────────────────
const photoEl   = document.getElementById('photo');
const sightCvs  = document.getElementById('sight-canvas');
const azCvs     = document.getElementById('azimuth-canvas');
const readoutEl = document.getElementById('readout');

// ── Init ───────────────────────────────────────────────────────
function init() {
  PW = photoEl.offsetWidth;
  PH = photoEl.offsetHeight;
  if (!PW || !PH) return;

  sightCvs.width  = PW;
  sightCvs.height = PH;

  azCvs.width  = PW;
  azCvs.height = VH + BH;

  render();
}

photoEl.addEventListener('load', () => requestAnimationFrame(init));
if (photoEl.complete && photoEl.naturalWidth > 0) requestAnimationFrame(init);
window.addEventListener('resize', () => requestAnimationFrame(init));

// ── Azimuth math ───────────────────────────────────────────────
function currentAz() {
  return LEFT_AZ + sightFrac * AZ_RANGE;
}

function azDegMin() {
  const az  = currentAz();
  const deg = Math.floor(az);
  const min = Math.round((az - deg) * 60);
  return min === 60 ? { deg: deg + 1, min: 0 } : { deg, min };
}

// ── Render ─────────────────────────────────────────────────────
function render() {
  if (sightVisible) {
    drawSight();
    drawStrip();
    updateReadout();
  } else {
    sightCvs.getContext('2d').clearRect(0, 0, PW, PH);
    azCvs.getContext('2d').clearRect(0, 0, PW, VH + BH);
    readoutEl.textContent = 'Az: — ° —′';
  }
}

// ── Sight overlay ──────────────────────────────────────────────
function drawSight() {
  const ctx = sightCvs.getContext('2d');
  ctx.clearRect(0, 0, PW, PH);

  const cx = Math.round(sightFrac * PW);

  const frameCol = '#b8902a';  // brass, fully opaque
  const lineCol  = 'rgba(210, 30, 30, 0.95)';

  ctx.save();
  ctx.fillStyle = frameCol;

  // Top cap — solid bar across full sight width, above inner window
  ctx.fillRect(cx - S.outerHW, 0, S.outerHW * 2, S.topCap);

  // Left bar — from top to base of foot section
  ctx.fillRect(cx - S.outerHW, 0, S.outerHW - S.innerHW, PH - S.footH);

  // Right bar
  ctx.fillRect(cx + S.innerHW, 0, S.outerHW - S.innerHW, PH - S.footH);

  // Bottom base — solid across full foot width including center gap
  ctx.fillRect(cx - S.outerHW - S.footOut, PH - S.footH,
               (S.outerHW + S.footOut) * 2, S.footH);

  // Inner aperture outline — subtle border around the transparent window
  const winY = S.topCap;
  const winH = PH - S.footH - winY;
  ctx.strokeStyle = 'rgba(70, 48, 20, 0.38)';
  ctx.lineWidth = 1;
  roundRect(ctx, cx - S.innerHW, winY, S.innerHW * 2, winH, S.cr);
  ctx.stroke();

  // Sighting line — ends at top of base
  ctx.strokeStyle = lineCol;
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, S.topCap);
  ctx.lineTo(cx, PH - S.footH);
  ctx.stroke();

  ctx.restore();
}

// ── Azimuth strip ──────────────────────────────────────────────
function drawStrip() {
  const ctx    = azCvs.getContext('2d');
  const ppm      = PW / (AZ_RANGE * 60);              // pixels per arcminute on base plate
  const vernierX = Math.round((1 - sightFrac) * PW);  // vernier arrow (moves opposite to sight)

  ctx.clearRect(0, 0, PW, VH + BH);

  // Gray background for the vernier strip row
  ctx.fillStyle = '#8c8c8c';
  ctx.fillRect(0, 0, PW, VH);

  // ── BASE PLATE ──────────────────────────────────────────────

  const bpTop = VH;

  // Background gradient (dull aluminum)
  const bgGrad = ctx.createLinearGradient(0, bpTop, 0, bpTop + BH);
  bgGrad.addColorStop(0,   '#c0c2c4');
  bgGrad.addColorStop(0.5, '#d0d2d4');
  bgGrad.addColorStop(1,   '#b0b2b4');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, bpTop, PW, BH);

  // Top border
  ctx.strokeStyle = '#888a8c';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, bpTop + 0.5);
  ctx.lineTo(PW, bpTop + 0.5);
  ctx.stroke();

  // "BASE PLATE" label (left edge)
  ctx.font = '9px Georgia';
  ctx.fillStyle = '#5a5c5e';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText('BASE PLATE', 4, bpTop + BH - 2);

  // Tick marks: degree and half-degree only; every 5th degree taller; multiples of 10 labeled
  ctx.strokeStyle = '#282828';
  ctx.fillStyle   = '#282828';
  ctx.lineWidth   = 1;

  for (let m = 0; m <= AZ_RANGE * 60; m += 30) {   // step = 30 arcmin = 0.5°
    const x      = m * ppm;
    const deg    = RIGHT_AZ - m / 60;  // reversed: high az on left, low az on right
    const isDeg  = (m % 60  === 0);
    const is5deg = isDeg && (Math.round(deg) % 5 === 0);

    const th = is5deg ? BH * 0.60
             : isDeg  ? BH * 0.42
             :          BH * 0.26;   // half-degree mark

    ctx.beginPath();
    ctx.moveTo(x, bpTop);
    ctx.lineTo(x, bpTop + th);
    ctx.stroke();

    if (isDeg && Math.round(deg) % 10 === 0) {
      ctx.font = '12px Georgia';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#282828';
      ctx.fillText(Math.round(deg), x, bpTop + th + 2);
    }
  }

  // ── VERNIER PLATE — fixed to sight ring; 0 at sight center, marks 0–30 to the LEFT ──
  //
  // 30 vernier divisions span exactly 29 half-degree marks on the base plate.
  // Each base half-degree = 30 arcmin, so each vernier division = 29 × 30 / 30 = 29 arcmin.
  // The difference of 1 arcmin per division yields 1-arcminute reading precision.
  // vW is derived from ppm so it scales correctly for any photograph.

  const halfDegPx = ppm * 30;        // pixels per half-degree on base plate
  const vW        = 29 * halfDegPx;  // 30 vernier divisions span 29 half-degree spacings
  const vPpm      = vW / 30;         // pixels per vernier division

  // Vernier background — shiny brass gradient, left of vernierX
  const vGrad = ctx.createLinearGradient(0, 1, 0, VH - 2);
  vGrad.addColorStop(0,   '#f0cc30');
  vGrad.addColorStop(0.5, '#d4a820');
  vGrad.addColorStop(1,   '#a87c10');
  ctx.fillStyle = vGrad;
  ctx.fillRect(vernierX - vW, 1, vW, VH - 2);

  // "VERNIER" label — kept within canvas bounds when plate is truncated
  ctx.font = '9px Georgia';
  ctx.fillStyle = '#3a1800';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('VERNIER', Math.max(2, vernierX - vW + 2), 2);

  // Vernier tick marks: 0 at vernierX, marks 1–30 extend LEFT; numbers increase right-to-left
  ctx.strokeStyle = '#3a1800';
  ctx.fillStyle   = '#3a1800';
  ctx.lineWidth   = 1;

  for (let vm = 0; vm <= 30; vm++) {
    const vx   = vernierX - vm * vPpm;   // marks go left from vernier center
    const is10 = (vm > 0 && vm % 10 === 0);
    const is5  = (vm > 0 && vm % 5  === 0 && !is10);
    const vh   = is10 ? VH * 0.55 : is5 ? VH * 0.36 : VH * 0.22;

    ctx.beginPath();
    ctx.moveTo(vx, VH - 2);
    ctx.lineTo(vx, VH - 2 - vh);
    ctx.stroke();

    if (is10) {
      ctx.font = '9px Georgia';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(vm, vx, VH - 2 - vh - 1);
    }
  }

  // Index arrow at vernierX — moves opposite to the sight line
  ctx.fillStyle = '#2a1000';
  ctx.beginPath();
  ctx.moveTo(vernierX,     VH - 2);
  ctx.lineTo(vernierX - 5, VH - 11);
  ctx.lineTo(vernierX + 5, VH - 11);
  ctx.closePath();
  ctx.fill();

  // Blue dashed index line from vernier arrow down through base plate
  ctx.strokeStyle = 'rgba(72, 108, 225, 0.55)';
  ctx.lineWidth   = 1;
  ctx.setLineDash([2, 3]);
  ctx.beginPath();
  ctx.moveTo(vernierX, VH);
  ctx.lineTo(vernierX, VH + BH);
  ctx.stroke();
  ctx.setLineDash([]);
}

// ── Readout ────────────────────────────────────────────────────
function updateReadout() {
  const { deg, min } = azDegMin();
  readoutEl.textContent = `Az:  ${deg}°  ${String(min).padStart(2, '0')}′`;
}

// ── Keyboard ───────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'o' || e.key === 'O') {
    sightVisible = !sightVisible;
    if (sightVisible && !sightShownOnce) {
      sightFrac = 0.5;   // first appearance: center of photo
      sightShownOnce = true;
    }
    render();
    return;
  }

  if (!sightVisible) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();

  const totalMin = AZ_RANGE * 60;                      // arcminutes across photo
  const step     = e.shiftKey ? 60 : 1;                // 1° if Shift, else 1′
  const dir      = e.key === 'ArrowRight' ? 1 : -1;

  sightFrac = Math.max(0, Math.min(1, sightFrac + (dir * step) / totalMin));
  render();
});

// ── Utility ────────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,     y + h, x,      y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y,         x + r,  y,         r);
  ctx.closePath();
}
</script>
</body>
</html>
